<div class="product-table-wrapper">
  <div class="product-table-container">
    <table class="custom-table table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Price</th>
          <th>Location</th>
          <th>Details</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <th scope="row">{{ product.id }}</th>
          <td>{{ product.name }}</td>
          <td>₱{{ product.price }}</td>
          <td>{{ product.location }}</td>
          <td>{{ product.details }}</td>
          <td>
            <a [routerLink]="['/details', product.id]" class="btn btn-outline-info view-details-btn btn-sm">
              View Details
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
